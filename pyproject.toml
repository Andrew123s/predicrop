[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-yield"
version = "0.1.0"
description = "One-year-ahead crop-yield forecasting from FAO yield/pesticide and World Bank climate data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.2",
    "scikit-learn>=1.5,<1.7",
    "xgboost>=2.1,<2.2",
    "lightgbm>=4.5,<4.7",
    "matplotlib>=3.9,<3.11",
    "seaborn>=0.13,<0.14",
    "scipy>=1.13,<1.16",
    "statsmodels>=0.14,<0.15",
    "shap>=0.46,<0.48",
    "streamlit>=1.40,<1.46",
    "joblib>=1.4,<1.5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<8.4", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
